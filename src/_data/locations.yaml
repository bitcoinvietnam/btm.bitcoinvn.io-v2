      - name: "Big Pig BBQ & Beer"
        slug: "big-pig-bbq"
        district: "Airport Area"
        lat: 10.809998036472463
        lng: 106.66502409983167
        mapsUrl: "https://www.google.com/maps/dir/?api=1&destination=10.809998036472463%2C106.66502409983167"
        address: "46 Truong Son, Phuong 2, Tan Binh, HCMC 70000"
        phone: "02835474034 – 02835474035"
        hours:
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          open: "10:30"
          close: "23:30"
          timezone: "Asia/Ho_Chi_Minh"
          display: "Every day 10:30 AM – 11:30 PM"
        style: "American Style BBQ"
        websiteName: "bigpig.vn"
        websiteUrl: "https://bigpig.vn"
        photos:
          - src: "/images/locations/big-pig-bbq/big-pig-bbq-1.jpg"
            alt: "BitcoinVN BTM at Big Pig BBQ & Beer in Ho Chi Minh City"
            caption: "Big Pig in 2023: still in its red exterior style, and at the time hosting one of the older models in our lineup."
            width: 1280
            height: 960
          - src: "/images/locations/big-pig-bbq/big-pig-bbq-2.jpg"
            alt: "Big Pig BBQ & Beer venue photo in Ho Chi Minh City"
            caption: "Big Pig lets you load up on meat aplenty."
            width: 1280
            height: 960
          - src: "/images/locations/big-pig-bbq/big-pig-bbq-3.jpg"
            alt: "Gustav BTM series machine inside Big Pig BBQ & Beer"
            caption: "Gustav BTM series inside - powered by Swedish-Vietnamese engineering"
            width: 856
            height: 1148
        description:
          - "Bitcoin & Meat — what a combination! Big Pig BBQ brings authentic American-style BBQ to Saigon, serving up brisket, ribs, pulled pork and more. Located right next to the airport on Truong Son street, it's one of the most convenient spots to buy or sell Bitcoin in all of Ho Chi Minh City."
          - "Whether you're arriving in or departing from Saigon, swing by Big Pig to grab some world-class BBQ and use our Bitcoin ATM. The BTM is located inside the restaurant and available during all opening hours."

      - name: "Capone's Chicago Pizza"
        slug: "capones-chicago-pizza"
        district: "District 2"
        lat: 10.8019328
        lng: 106.7285487
        mapsUrl: "https://www.google.com/maps/dir/?api=1&destination=10.8019328%2C106.7285487"
        address: "8/3 Duong so 49B, Thao Dien, Quan 2, HCMC"
        phone: "+84338787459"
        hours:
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          open: "11:00"
          close: "23:00"
          timezone: "Asia/Ho_Chi_Minh"
          display: "Every day 11 AM – 11 PM"
        style: "Authentic Chicago Deep Dish pizza & street food"
        websiteName: "caponessaigon.com"
        websiteUrl: "https://caponessaigon.com"
        photos:
          - src: "/images/locations/capones-chicago-pizza/capones-chicago-pizza-1.jpg"
            alt: "Capone's Chicago Pizza location photo in Thao Dien"
            caption: "Capone's - a piece of Chicago in Thao Dien"
            width: 1280
            height: 960
          - src: "/images/locations/capones-chicago-pizza/capones-chicago-pizza-2.jpg"
            alt: "Dining area at Capone's Chicago Pizza"
            caption: "Gustav BTM - next to the staircase inside Capone's"
            width: 1280
            height: 960
          - src: "/images/locations/capones-chicago-pizza/capones-chicago-pizza-3.jpg"
            alt: "Signature dish at Capone's Chicago Pizza"
            caption: "Deep-dish specialty at Capone's"
            width: 983
            height: 551
        description:
          - "Capone's is the only place in Vietnam serving authentic Chicago-style deep dish pizza. Located in the heart of Thao Dien, District 2, the restaurant offers stunning views of Landmark 81 — the tallest building in Vietnam — from its rooftop terrace."
          - "In addition to deep dish pizza, Capone's serves a range of American street food favorites. The BitcoinVN BTM is conveniently located inside the restaurant, making it easy to buy or sell Bitcoin while enjoying a meal in one of Saigon's trendiest neighborhoods."

      - name: "Green Box"
        slug: "green-box"
        district: "District 2"
        lat: 10.8046788
        lng: 106.7321307
        mapsUrl: "https://www.google.com/maps/dir/?api=1&destination=10.8046788%2C106.7321307"
        address: "6 Le Van Mien, Thao Dien, Quan 2, HCMC 71107"
        phone: "+840795070010"
        hours:
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          open: "08:00"
          close: "00:00"
          timezone: "Asia/Ho_Chi_Minh"
          display: "Every day 8 AM – 12 AM"
        style: "Healthy food, Poke-style, Viet Fusion"
        websiteName: "Green Box @ SOMA (Facebook)"
        websiteUrl: "https://www.facebook.com/greenboxsoma"
        photos:
          - src: "/images/locations/green-box/green-box-1.jpg"
            alt: "Green Box venue photo in Thao Dien"
            caption: "Green Box in Thao Dien - follow the orange sign"
            width: 1280
            height: 961
          - src: "/images/locations/green-box/green-box-3.jpg"
            alt: "Menu and atmosphere photo at Green Box"
            caption: "Fresh food and relaxed atmosphere at Green Box"
            width: 1269
            height: 1243
          - src: "/images/locations/green-box/green-box-2.jpg"
            alt: "Interior detail at Green Box in Thao Dien"
            caption: "Inside Green Box at SOMA"
            width: 768
            height: 1024
        description:
          - "Green Box in Thao Dien is a popular healthy dining spot, serving creative poke bowls, Viet-fusion dishes, and fresh smoothies in a relaxed community setting at SOMA on Le Van Mien Street. As a long-time BitcoinVN BTM partner, it offers a convenient place to buy or sell Bitcoin for cash in District 2."
          - "Located in one of Ho Chi Minh City's most vibrant expat and digital-nomad neighborhoods, the venue features walkable surroundings, friendly staff, and daily opening hours from 8 AM to midnight - making BitcoinVN BTM access simple whether you're stopping by for a quick meal or a remote-work session."

      - name: "Italiani's Pizza"
        slug: "italianis-ben-thanh"
        district: "Ben Thanh, District 1"
        lat: 10.7696987
        lng: 106.7000222
        mapsUrl: "https://www.google.com/maps/dir/?api=1&destination=10.7696987%2C106.7000222"
        address: "46 Nguyen Thai Binh, D1, HCMC"
        phone: "+84968874992"
        hours:
          days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
          open: "11:00"
          close: "23:30"
          timezone: "Asia/Ho_Chi_Minh"
          display: "Every day 11 AM – 11:30 PM"
        style: "Italian restaurant (Pizza & Pasta)"
        websiteName: "italianis.vn"
        websiteUrl: "https://italianis.vn"
        photos:
          - src: "/images/locations/italianis-ben-thanh/italianis-ben-thanh-1.jpg"
            alt: "Burrata pizza served at Italiani's Ben Thanh"
            caption: "The famous Burrata pizza - a regular highlight on the Italiani's menu"
            width: 1280
            height: 960
          - src: "/images/locations/italianis-ben-thanh/italianis-ben-thanh-2.jpg"
            alt: "Fiat Eater Gustav BTM variant at Italiani's Ben Thanh"
            caption: "Italiani's Ben Thanh features our more colourful 'Fiat Eater' variant of our Gustav BTM series"
            width: 863
            height: 1157
        description:
          - "Italiani's Pizza on Nguyen Thai Binh street is located in the bustling heart of District 1, just steps from Ben Thanh Market — one of the most iconic landmarks in Ho Chi Minh City."
          - "Whether you're craving a classic Margherita or something more adventurous, Italiani's delivers quality Italian food in a vibrant setting."
          - "District 1 is the commercial and tourist heart of Ho Chi Minh City, making this one of the most accessible BTM locations for both visitors and residents. The area is well-served by public transport and is within walking distance of numerous hotels, shops, and attractions."
          - "Stop by Italiani's for a slice of Italy in Vietnam, and while you're at it, use the BTM to stack some sats."

