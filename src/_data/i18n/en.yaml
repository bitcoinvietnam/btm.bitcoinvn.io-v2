site:
  tagline: "The fastest & most private way to buy & sell Bitcoin for cash in Vietnam"
  description: "Self-service Bitcoin ATMs across Ho Chi Minh City and Vung Tau. No bank account. No KYC. Walk up, transact, walk away."
  notice:
    message: "SMS delivery for OTP codes is currently affected by domestic telecom changes. Our support team is available to assist with your transaction via Telegram or Facebook."

