      description: "Buy or sell Bitcoin with just cash. No bank account, no wire transfers, no financial intermediaries required."
    - title: "Fast & Convenient"
      description: "Almost as easy as buying a bottle of Coca-Cola from a vending machine. Walk up, transact, and you're done."
