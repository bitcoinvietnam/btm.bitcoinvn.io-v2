      description: "Donde se permite, las transacciones pueden completarse con información personal limitada, ayudando a proteger tu privacidad financiera."
    - title: "Precios transparentes"
      description: "El precio que ves es el precio que pagas. Las tarifas se fijan en el momento de la transacción — sin comisiones ocultas ni sorpresas."
