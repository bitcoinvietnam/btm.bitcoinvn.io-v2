faq:
  items:
    - question: "¿Qué es un cajero Bitcoin?"
      answer: "Un cajero Bitcoin (o BTM) es un kiosco de autoservicio de criptomonedas que te permite comprar y vender Bitcoin usando efectivo. Funciona de manera similar a un cajero automático tradicional, pero en lugar de retirar efectivo de tu cuenta bancaria, te permite intercambiar efectivo por Bitcoin y viceversa."
    - question: "¿Por qué usar un BTM de BitcoinVN?"
      answer: "Los BTM de BitcoinVN ofrecen la forma más rápida y privada de comprar y vender Bitcoin en Vietnam. No se requiere cuenta bancaria y las transacciones se completan en minutos. Operamos desde 2014, lo que nos convierte en el servicio Bitcoin más consolidado de Vietnam."
    - question: "¿Necesito presentar identificación o verificar mi identidad (KYC)?"
      answer: "Los BTM de BitcoinVN están diseñados para transacciones de Bitcoin sencillas y en persona. Para el uso típico cotidiano, las transacciones pueden completarse rápidamente en la máquina sin un largo proceso de incorporación — siguiendo un enfoque de datos mínimos que ayuda a limitar la exposición innecesaria de información personal."
    - question: "¿Hay límites de transacción?"
      answer: "Actualmente no hay límites de transacción en nuestros BTM. Puedes comprar o vender la cantidad de Bitcoin que necesites en una sola operación."
    - question: "¿Cuáles son las comisiones?"
      answer: "Nuestra estructura de comisiones es competitiva y transparente. El precio que se muestra en la pantalla del BTM incluye todas las comisiones — lo que ves es lo que obtienes. Sin cargos ocultos ni descuentos sorpresa."
    - question: "¿Es legal Bitcoin en Vietnam?"
      answer: "Aunque Bitcoin no se reconoce como moneda de curso legal en Vietnam, poseer y operar con Bitcoin no es ilegal."
    - question: "¿Cómo puedo saber si un BTM está en línea?"
      answer: "Publicamos el estado en tiempo real de los BTM en nuestro <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>canal de Telegram</a> y en nuestra <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>página de Facebook</a>. Síguenos para la información de disponibilidad más reciente."
    - question: "¿Y si no tengo un wallet de Bitcoin?"
      answer: "¡No hay problema! Nuestros BTM pueden generar una paper wallet para ti durante la compra. Recibirás un papel impreso con tu dirección de Bitcoin y la clave privada. Recomendamos transferir tus fondos a un wallet seguro después — para almacenamiento a largo plazo, un hardware wallet es la opción más segura. Puedes adquirir uno en la <a href='https://bitcoinvn.io/shop' target='_blank' rel='noopener'>tienda BitcoinVN</a>, proveedor oficial de dispositivos de marcas líderes como Trezor y Ledger."
    - question: "Tengo problemas con la verificación por SMS. ¿Qué hago?"
      answer: "Debido a cambios recientes en las telecomunicaciones nacionales, la entrega de SMS para códigos OTP puede verse afectada. Por favor contacta a nuestro equipo de soporte a través de <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram</a> o <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>Facebook</a> y te ayudaremos a completar tu transacción."
    - question: "¿Puedo comprar Bitcoin en línea?"
      answer: "¡Sí! Si prefieres comprar Bitcoin en línea, visita <a href='https://bitcoinvn.io' target='_blank' rel='noopener'>bitcoinvn.io</a> para usar nuestro servicio de exchange online. Hay transferencias bancarias y otros métodos de pago disponibles."
    - question: "¿Qué otras criptomonedas admiten sus BTM?"
      answer: "BTC es nuestro activo principal, pero desde mayo de 2026 nuestras máquinas también admiten USDT (Tether) y USDC (Circle) en la red Ethereum, además de ZEC (Zcash) y XMR (Monero). Pueden incorporarse integraciones blockchain adicionales con el tiempo, en función de la demanda y del desarrollo continuo de la <a href='https://bitcoinvn.io/api/doc' target='_blank' rel='noopener'>API del motor de intercambio de BitcoinVN</a>."

locations:
  regions:
    - name: "Ho Chi Minh City"
      description: "La ciudad más grande de Vietnam y su centro económico — hogar de una próspera comunidad expatriada y de una creciente adopción del Bitcoin."
      machines:
        big-pig-bbq:
          hours_display: "Todos los días 10:30 – 23:30"
          description:
            - "¡Bitcoin y carne — vaya combinación! Big Pig BBQ trae a Saigón un auténtico BBQ al estilo americano, con brisket, costillas, pulled pork y mucho más. Ubicado justo al lado del aeropuerto, en Truong Son Street, es uno de los lugares más cómodos para comprar o vender Bitcoin en toda Ho Chi Minh City."
            - "Ya estés llegando o saliendo de Saigón, pásate por Big Pig para disfrutar de un BBQ de primer nivel y usar nuestro cajero Bitcoin. El BTM está dentro del restaurante y disponible durante todo el horario de apertura."
          photos:
            - caption: "Big Pig en 2023: aún con su fachada en estilo rojo y entonces albergando uno de los modelos más antiguos de nuestra gama."
            - caption: "En Big Pig podrás darte un festín de carne."
            - caption: "Serie Gustav BTM en el interior — fruto de la ingeniería sueco-vietnamita"
        capones-chicago-pizza:
          hours_display: "Todos los días 11:00 – 23:00"
          description:
            - "Capone's es el único lugar de Vietnam que sirve auténtica pizza deep dish estilo Chicago. En el corazón de Thao Dien, distrito 2, el restaurante ofrece desde su terraza en la azotea vistas impresionantes del Landmark 81 — el edificio más alto de Vietnam."
            - "Además de la pizza deep dish, Capone's sirve una variedad de clásicos del street food americano. El BTM de BitcoinVN se encuentra cómodamente dentro del restaurante, lo que facilita comprar o vender Bitcoin mientras disfrutas una comida en uno de los barrios más de moda de Saigón."
          photos:
            - caption: "Capone's — un pedazo de Chicago en Thao Dien"
            - caption: "Gustav BTM — junto a la escalera en el interior de Capone's"
            - caption: "Especialidad deep dish de Capone's"
        green-box:
          hours_display: "Todos los días 8:00 – 24:00"
          description:
            - "Green Box, en Thao Dien, es un destino popular para comer sano. Sirve poke bowls creativos, platos de fusión vietnamita y batidos frescos en un ambiente comunitario relajado en SOMA, sobre Le Van Mien Street. Como socio histórico de BitcoinVN BTM, ofrece un lugar cómodo para comprar o vender Bitcoin por efectivo en el distrito 2."
            - "Situado en uno de los barrios más vibrantes para expatriados y nómadas digitales de Ho Chi Minh City, el local cuenta con un entorno peatonal, personal amable y horario diario de 8:00 a medianoche — el acceso al BTM de BitcoinVN es sencillo, ya vengas a comer rápido o a una sesión de teletrabajo."
          photos:
            - caption: "Green Box en Thao Dien — sigue el cartel naranja"
            - caption: "Comida fresca y ambiente relajado en Green Box"
            - caption: "Interior de Green Box en SOMA"
        italianis-ben-thanh:
          hours_display: "Todos los días 11:00 – 23:30"
          description:
            - "Italiani's Pizza, en Nguyen Thai Binh Street, está en el bullicioso corazón del distrito 1, a pocos pasos del Ben Thanh Market — uno de los lugares más emblemáticos de Ho Chi Minh City."
            - "Tanto si te apetece una clásica Margherita como algo más atrevido, Italiani's ofrece comida italiana de calidad en un ambiente vibrante."
            - "El distrito 1 es el corazón comercial y turístico de Ho Chi Minh City, lo que convierte a este local en una de las ubicaciones BTM más accesibles tanto para visitantes como para residentes. La zona cuenta con buen transporte público y está a poca distancia a pie de numerosos hoteles, tiendas y atracciones."
            - "Pásate por Italiani's a por un pedazo de Italia en Vietnam — y aprovecha para apilar unos sats en el BTM."
          photos:
            - caption: "La famosa pizza Burrata — un imprescindible habitual de la carta de Italiani's"
            - caption: "Italiani's Ben Thanh luce nuestra variante más colorida «Fiat Eater» de la serie Gustav BTM"
        italianis-han-thuyen:
          hours_display: "Todos los días 11:00 – 21:45"
          description:
            - "La ubicación de Italiani's en Han Thuyen Street se encuentra justo al lado de un bonito parque en el barrio de Ben Nghe, en el distrito 1. Un sitio tranquilo para disfrutar de una pizza y hacer una transacción de Bitcoin, lejos del bullicio de las calles principales."
            - "La ubicación de Han Thuyen combina el encanto de un restaurante italiano de barrio con la comodidad del acceso a Bitcoin. Tanto si eres veterano de Bitcoin como si haces tu primera compra, el personal amable te guiará por todo el proceso."
          photos:
            - caption: "Pizza & Bitcoin: la combinación de ensueño popularizada por Laszlo Hanyecz"
            - caption: "Sigue el ₿ naranja: la entrada de Italiani's Han Thuyen"
            - caption: "Nuestro BTM Gustav está en la planta superior — tu privacidad, respetada."
    - name: "Vung Tau"
      description: "Una popular escapada costera a solo dos horas de Saigón — surf, sol y Bitcoin junto al mar."
      machines:
        surf-hostel:
          hours_display: "Todos los días 8:00 – 22:00"
          description:
            - "Surf Hostel en Vung Tau es una escuela de surf y albergue para mochileros a pocos minutos de la playa. Ofrece clases de surf, alquiler de tablas y un ambiente comunal relajado, muy popular entre viajeros, mochileros y nómadas digitales. Como socio de BitcoinVN BTM, brinda un lugar cómodo para comprar o vender Bitcoin disfrutando del entorno costero."
            - "Situado en una de las escapadas de fin de semana favoritas del sur de Vietnam desde Ho Chi Minh City, el albergue combina un ambiente playero relajado con un acceso sencillo a los servicios de Bitcoin durante su horario de apertura, de 8:00 a 22:00. Ya sea para recargar el wallet entre sesiones de surf o cambiar efectivo para gastos locales, los visitantes pueden usar el BTM de BitcoinVN rápida y cómodamente."
          photos:
            - caption: "BTM BitcoinVN en Surf Hostel"
            - caption: "Ambiente de escuela de surf en Surf Hostel"
    - name: "Da Nang"
      description: "El centro costero del Vietnam central — vida de playa, hospitalidad internacional y acceso a Bitcoin en una de las ciudades de más rápido crecimiento del país."
      machines:
        westwood-da-nang:
          hours_display: "Todos los días 12:00 – 23:00"
          description:
            - "Westwood Da Nang es un destino gastronómico moderno situado en An Thuong, entre My Khe Beach y el Han River, que ofrece una experiencia de cena elevada en uno de los distritos de hospitalidad más activos de Da Nang."
            - "La carta se centra en cocina al fuego de leña, carnes premium, mariscos, ingredientes de temporada y cocina de inspiración occidental cuidadosamente preparada, junto con una sólida selección de vinos y cócteles. Con su ambiente refinado pero cercano, Westwood es un lugar práctico para comprar o vender Bitcoin durante una visita al centro de Da Nang."
          photos:
            - caption: "BTM BitcoinVN dentro de Westwood Da Nang"
            - caption: "Westwood Da Nang en An Thuong"
            - caption: "El BTM está dentro del restaurante, cerca del arte interior de Westwood."
            - caption: "Detalles del comedor y acceso a Bitcoin en Westwood Da Nang"

host_page:
  meta_description: "Asóciate con BitcoinVN para alojar un cajero Bitcoin en tu negocio. Ingresos por alquiler mensuales fijos, sin coste de equipo, operaciones totalmente gestionadas."
  hero:
    heading: "Aloja un cajero Bitcoin con BitcoinVN"
    intro: "BitcoinVN sigue abierta a expandir selectivamente su red de cajeros Bitcoin (BTM) por Vietnam, conforme a los requisitos locales. Nos asociamos con locales comerciales de alto tránsito, hostels/hoteles, cafeterías, pizzerías y restaurantes occidentales para instalar y operar BTM seguros y totalmente gestionados."
    value_prop:
      you_provide: "Tú aportas el espacio."
      we_provide: "Nosotros aportamos la infraestructura."
      you_receive: "Tú obtienes ingresos pasivos."
  benefits:
    section_tag: "Tus beneficios"
    heading: "¿Por qué alojar un cajero BitcoinVN?"
    items:
      - title: "Ingresos por alquiler mensuales fijos"
        description: "Recibe un pago de alquiler predecible y fijo cada mes — independiente del volumen de transacciones. Los pagos se liquidan el día 28 de cada mes."
      - title: "Mayor tráfico internacional"
        description: "Los usuarios de cajeros Bitcoin suelen ser turistas, expatriados, nómadas digitales y trabajadores remotos. Estos clientes con frecuencia realizan compras adicionales durante su visita, lo que aumenta la visibilidad del local y la afluencia."
      - title: "Coste cero del equipo"
        description: "BitcoinVN cubre todos los costes relacionados con la entrega e instalación, inspección, mantenimiento y servicio, reparaciones y sustitución, monitorización y gestión del sistema, y la retirada si fuera necesario."
      - title: "Operaciones totalmente gestionadas"
        description: "Gestionamos la logística del efectivo, la operación del software, los procedimientos de cumplimiento, los requisitos KYC, la monitorización de la máquina y la atención al cliente. Tú te centras en tu negocio principal. Nosotros nos ocupamos del resto."
