    - title: "Intercambio inmediato en el sitio"
      description: "Completa tu transacción directamente en el lugar, sin depender de contrapartes desconocidas ni de transferencias previas."
    - title: "Fiables y monitorizados"
      description: "Todos los BTM están monitorizados de forma continua, con actualizaciones de estado en tiempo real. La disponibilidad se publica en nuestros canales de Telegram y Facebook."
    - title: "Establecidos y de confianza"
      description: "Operados por BitcoinVN - una de las empresas Bitcoin más veteranas de Asia. Años de fiabilidad probada al servicio de miles de clientes."

