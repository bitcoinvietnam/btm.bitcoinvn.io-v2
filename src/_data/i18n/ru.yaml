faq:
  items:
    - question: "Что такое Bitcoin-банкомат?"
      answer: "Bitcoin-банкомат (или BTM) — это самообслуживаемый криптовалютный терминал, позволяющий покупать и продавать Bitcoin за наличные. Он работает аналогично обычному банкомату, но вместо снятия денег с банковского счёта позволяет обменивать наличные на Bitcoin и обратно."
    - question: "Почему стоит использовать BitcoinVN BTM?"
      answer: "BitcoinVN BTM предлагает самый быстрый и приватный способ покупки и продажи Bitcoin во Вьетнаме. Банковский счёт не нужен, а транзакции занимают считанные минуты. Мы работаем с 2014 года и являемся самым опытным Bitcoin-сервисом в стране."
    - question: "Нужно ли предоставлять документы или проходить верификацию личности (KYC)?"
      answer: "BitcoinVN BTM созданы для простых и удобных Bitcoin-транзакций. При типичном повседневном использовании операции можно завершить быстро — без длительного процесса регистрации. Мы придерживаемся подхода с минимальным сбором данных, что помогает ограничить излишнее раскрытие личной информации."
    - question: "Есть ли лимиты на транзакции?"
      answer: "На данный момент наши BTM не имеют ограничений по суммам транзакций. Вы можете купить или продать столько Bitcoin, сколько вам нужно, за одну операцию."
    - question: "Какие комиссии?"
      answer: "Наша комиссионная структура конкурентоспособна и прозрачна. Цена, отображаемая на экране BTM, включает все комиссии — никаких скрытых платежей и неожиданных списаний."
    - question: "Законен ли Bitcoin во Вьетнаме?"
      answer: "Хотя Bitcoin не признан законным платёжным средством во Вьетнаме, владение Bitcoin не запрещено. Однако Вьетнам переходит к более регулируемому рынку криптоактивов: подробные правила и требования вводятся поэтапно. Поэтому доступность сервиса может меняться по мере развития новой нормативной базы. Подробнее см. Постановление № 284/2026/NĐ-CP."
    - question: "Как проверить, работает ли BTM сейчас?"
      answer: "Мы публикуем актуальные статусы BTM в нашем <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram-канале</a> и на нашей <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>странице Facebook</a>. Подпишитесь, чтобы всегда быть в курсе."
    - question: "Что если у меня нет Bitcoin-кошелька?"
      answer: "Не проблема! Наши BTM могут создать для вас бумажный кошелёк прямо в процессе покупки. Вы получите распечатанный лист с адресом кошелька и приватным ключом. Рекомендуем впоследствии перевести средства в защищённый кошелёк — для долгосрочного хранения лучшим вариантом является аппаратный кошелёк. Приобрести его можно в <a href='https://bitcoinvn.io/shop' target='_blank' rel='noopener'>магазине BitcoinVN</a> — официальном поставщике устройств ведущих брендов, таких как Trezor и Ledger."
    - question: "У меня проблемы с SMS-верификацией. Что делать?"
      answer: "Из-за недавних изменений в работе местных операторов связи доставка SMS с OTP-кодами может быть нарушена. Пожалуйста, обратитесь в нашу службу поддержки через <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram</a> или <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>Facebook</a> — мы поможем вам завершить транзакцию."
    - question: "Можно ли купить Bitcoin онлайн?"
      answer: "Да! Если вы предпочитаете покупать Bitcoin онлайн, посетите <a href='https://bitcoinvn.io' target='_blank' rel='noopener'>bitcoinvn.io</a> и воспользуйтесь нашим онлайн-обменником. Доступны банковские переводы и другие способы оплаты."
    - question: "Какие ещё криптовалюты поддерживают ваши банкоматы?"
      answer: "BTC остаётся нашим основным активом, но с мая 2026 года наши терминалы также поддерживают USDT (Tether) и USDC (Circle) в сети Ethereum, а также ZEC (Zcash) и XMR (Monero). Со временем могут добавляться интеграции с другими блокчейнами — в зависимости от спроса пользователей и развития <a href='https://bitcoinvn.io/api/doc' target='_blank' rel='noopener'>API обменного движка BitcoinVN</a>."

locations:
  regions:
    - name: "Ho Chi Minh City"
      description: "Крупнейший город и экономический центр Вьетнама — место активного экспат-сообщества и растущего интереса к Bitcoin."
      machines:
        big-pig-bbq:
          hours_display: "Каждый день 10:30 – 23:30"
          description:
            - "Bitcoin и мясо — какое сочетание! Big Pig BBQ предлагает аутентичное американское барбекю в Saigon: брискет, рёбрышки, тяжёная свинина и многое другое. Расположенный прямо у аэропорта на улице Truong Son, это одно из самых удобных мест для покупки или продажи Bitcoin в Ho Chi Minh City."
            - "Прилетаете или улетаете из Saigon — загляните в Big Pig, чтобы насладиться барбекю мирового уровня и воспользоваться нашим Bitcoin-банкоматом. BTM находится внутри ресторана и доступен в течение всего рабочего времени."
          photos:
            - caption: "Big Pig в 2023 году: всё ещё в красном фасаде и с одной из старых моделей нашей линейки."
            - caption: "В Big Pig можно наесться мясом вволю."
            - caption: "Внутри серия Gustav BTM — шведско-вьетнамские инженерные решения"
        capones-chicago-pizza:
          hours_display: "Каждый день 11:00 – 23:00"
          description:
            - "Capone's — единственное место во Вьетнаме с настоящей чикагской пиццей в стиле deep dish. Расположенный в сердце Thao Dien, District 2, ресторан предлагает захватывающий вид на Landmark 81 — самое высокое здание Вьетнама — с террасы на крыше."
            - "Помимо deep dish, Capone's подаёт широкий ассортимент американских уличных блюд. BitcoinVN BTM удобно расположен внутри ресторана — купите или продайте Bitcoin прямо во время обеда в одном из самых модных кварталов Saigon."
