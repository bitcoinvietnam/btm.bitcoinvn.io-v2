            - "Локация на Han Thuyen сочетает уют районного итальянского ресторана с удобным доступом к Bitcoin. Независимо от того, опытный вы биткоинер или совершаете первую покупку, дружелюбный персонал поможет разобраться в процессе."
          photos:
