  notice:
    message:
      - "После более чем десяти лет эксплуатации биткоин-банкоматов (BTM) во Вьетнаме команда BitcoinVN в ближайшие недели постепенно прекратит непосредственное управление BTM на вьетнамском рынке."
      - "Мы тесно сотрудничаем с соответствующими партнёрами и заинтересованными сторонами, чтобы обеспечить упорядоченный переход."
      - "Дальнейшие обновления последуют по мере согласования деталей."

features:
  heading: "9 причин использовать BitcoinVN BTM"
  subheading: "Наш сервис создан для защиты вашей финансовой конфиденциальности при покупке и продаже BTC за наличные."
  items:
    - title: "Без банковского счёта"
      description: "Покупайте и продавайте Bitcoin только за наличные. Никаких банковских счетов, переводов или финансовых посредников."
    - title: "Быстро и удобно"
      description: "Почти так же просто, как купить бутылку колы из автомата. Подошли, совершили операцию — и готово."
    - title: "Минимум данных"
      description: "Там, где это разрешено, транзакции можно завершить с минимальным набором персональных данных — для защиты вашей финансовой приватности."
    - title: "Прозрачные цены"
      description: "Цена, которую вы видите, — та цена, которую вы платите. Курс фиксируется в момент транзакции — никаких скрытых комиссий и неприятных сюрпризов."
    - title: "Подтверждение в реальном времени"
      description: "Транзакция мгновенно транслируется в блокчейн. Отслеживайте её в режиме реального времени по предоставленной ссылке."
    - title: "Двуязычная поддержка"
      description: "Наша команда готова помочь вам на удобном для вас языке."
    - title: "Обмен на месте"
      description: "Совершайте транзакцию прямо на точке — без незнакомых контрагентов и предварительных переводов."
    - title: "Надёжно и под контролем"
      description: "Все BTM непрерывно мониторятся с обновлением статуса в реальном времени. Актуальная информация о доступности публикуется в наших каналах Telegram и Facebook."
    - title: "Проверено временем"
      description: "Работает под управлением BitcoinVN - одной из старейших Bitcoin-компаний Азии. Годы надёжной работы и тысячи довольных клиентов."

