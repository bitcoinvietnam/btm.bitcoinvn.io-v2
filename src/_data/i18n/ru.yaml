            - caption: "Capone's — кусочек Чикаго в Thao Dien"
            - caption: "Gustav BTM — рядом с лестницей внутри Capone's"
            - caption: "Фирменная deep-dish пицца в Capone's"
        green-box:
          hours_display: "Каждый день 8:00 – 00:00"
          description:
            - "Green Box в Thao Dien — популярное кафе здорового питания: креативные поке-боулы, блюда вьет-фьюжн и свежие смузи в уютной атмосфере SOMA на улице Le Van Mien. Как давний партнёр BitcoinVN BTM, это удобное место для покупки и продажи Bitcoin за наличные в District 2."
            - "Расположенный в одном из самых оживлённых кварталов Ho Chi Minh City, популярных среди экспатов и цифровых кочевников, ресторан отличается пешеходной доступностью, дружелюбным персоналом и режимом работы с 8:00 до полуночи — доступ к BitcoinVN BTM удобен как во время быстрого обеда, так и во время рабочей сессии."
          photos:
            - caption: "Green Box в Thao Dien — ориентируйтесь на оранжевую вывеску"
            - caption: "Свежая еда и непринуждённая атмосфера в Green Box"
            - caption: "Внутри Green Box в SOMA"
        italianis-ben-thanh:
          hours_display: "Каждый день 11:00 – 23:30"
          description:
            - "Italiani's Pizza на улице Nguyen Thai Binh находится в самом центре District 1, в нескольких шагах от рынка Ben Thanh — одной из самых знаковых достопримечательностей Ho Chi Minh City."
            - "Хотите классическую Маргариту или что-то более экзотическое — Italiani's предлагает качественную итальянскую кухню в оживлённой обстановке."
            - "District 1 — это торговое и туристическое сердце Ho Chi Minh City, что делает эту точку одной из наиболее доступных локаций BTM как для туристов, так и для жителей. Район хорошо обслуживается общественным транспортом и пешей доступности от многочисленных отелей, магазинов и достопримечательностей."
            - "Загляните в Italiani's за кусочком Италии во Вьетнаме — и заодно пополните свои сатоши через BTM."
          photos:
            - caption: "Знаменитая пицца Бурата — постоянный хит меню Italiani's"
            - caption: "Italiani's Ben Thanh — наш более яркий вариант BTM серии Gustav под названием 'Fiat Eater'"
