features:
  heading: "BitcoinVN BTMを使う9つの理由"
  subheading: "ベトナムで現金によるBTCの売買において、お客様の金融プライバシーを守るために設計されたサービスです。"
  items:
    - title: "銀行口座不要"
      description: "現金だけでBitcoinを売買できます。銀行口座も、銀行振込も、金融仲介業者も必要ありません。"
    - title: "速くて便利"
      description: "自動販売機でコーラを買うのとほぼ同じくらい簡単です。マシンの前に行き、取引して、完了です。"
    - title: "最小限のデータ収集"
      description: "法令で許可されている範囲内で、最小限の個人情報で取引を完了でき、金融プライバシーの保護に役立ちます。"
    - title: "透明な価格設定"
      description: "表示価格がそのままお取引価格です。レートは取引時点で固定され、隠れた手数料や追加料金はありません。"
    - title: "リアルタイム確認"
      description: "取引は即座にブロックチェーンにブロードキャストされます。提供されるトラッキングリンクでリアルタイムに取引を追跡できます。"
    - title: "バイリンガルサポート"
      description: "英語とベトナム語の両方で完全サポート。お好みの言語でチームがお手伝いいたします。"
    - title: "その場で即時交換"
      description: "見知らぬ取引相手や事前送金に頼ることなく、設置場所で直接取引を完了できます。"
    - title: "信頼性の高い監視体制"
      description: "全BTMはリアルタイムのステータス更新による継続的な監視を行っています。稼働状況はTelegramおよびFacebookチャネルで公開しています。"
    - title: "信頼と実績"
      description: "ベトナムで最も長い歴史を持つBitcoin企業、BitcoinVNが運営。数千人のお客様にサービスを提供してきた長年の実績があります。"

