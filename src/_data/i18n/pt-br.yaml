      description: "As transações são transmitidas à blockchain instantaneamente. Acompanhe a sua operação em tempo real pelos links de rastreamento fornecidos."
    - title: "Suporte bilíngue"
      description: "Nossa equipe está pronta para atender no idioma de sua preferência."
    - title: "Troca imediata no local"
      description: "Conclua a sua transação diretamente no local, sem depender de contrapartes desconhecidas nem de transferências antecipadas."
    - title: "Confiáveis e monitorados"
      description: "Todos os BTMs são monitorados continuamente, com atualizações de status em tempo real. A disponibilidade é divulgada nos nossos canais do Telegram e Facebook."
    - title: "Estabelecidos e confiáveis"
      description: "Operados pela BitcoinVN - uma das empresas Bitcoin mais antigas da Ásia. Anos de confiabilidade comprovada atendendo milhares de clientes."

