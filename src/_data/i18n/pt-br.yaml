faq:
  items:
    - question: "O que é um Bitcoin ATM?"
      answer: "Um Bitcoin ATM (ou BTM) é um quiosque de autoatendimento de criptomoedas que permite comprar e vender Bitcoin em dinheiro. Funciona de forma parecida com um caixa eletrônico comum, mas em vez de sacar dinheiro da sua conta bancária, ele permite trocar dinheiro por Bitcoin e vice-versa."
    - question: "Por que usar um BTM BitcoinVN?"
      answer: "Os BTMs da BitcoinVN oferecem a forma mais rápida e privada de comprar e vender Bitcoin no Vietnã. Não é necessário conta bancária e as transações são concluídas em minutos. Operamos desde 2014, o que faz da gente o serviço de Bitcoin mais consolidado do Vietnã."
    - question: "Preciso apresentar documento ou fazer verificação de identidade (KYC)?"
      answer: "Os BTMs da BitcoinVN foram pensados para transações de Bitcoin diretas e presenciais. Para o uso típico do dia a dia, as transações podem ser concluídas rapidamente na máquina, sem um longo processo de cadastro — seguindo uma abordagem com dados mínimos que ajuda a limitar a exposição desnecessária de informações pessoais."
    - question: "Existem limites por transação?"
      answer: "Atualmente não há limites de transação nos nossos BTMs. Você pode comprar ou vender quanto Bitcoin precisar em uma única operação."
    - question: "Quais são as taxas?"
      answer: "Nossa estrutura de taxas é competitiva e transparente. O preço exibido na tela do BTM já inclui todas as taxas — o que você vê é o que você paga. Sem cobranças ocultas nem descontos-surpresa."
    - question: "O Bitcoin é legal no Vietnã?"
      answer: "Embora o Bitcoin não seja reconhecido como moeda de curso legal no Vietnã, possuir e negociar Bitcoin não é ilegal."
    - question: "Como faço para saber se um BTM está online?"
      answer: "Publicamos o status dos BTMs em tempo real no nosso <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>canal do Telegram</a> e na nossa <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>página do Facebook</a>. Siga a gente para receber as informações mais recentes de disponibilidade."
    - question: "E se eu não tiver uma carteira Bitcoin?"
      answer: "Sem problema! Nossos BTMs podem gerar uma paper wallet para você durante a compra. Você recebe um papel impresso com o seu endereço Bitcoin e a chave privada. Recomendamos transferir os fundos depois para uma carteira segura — para guarda de longo prazo, uma hardware wallet é a opção mais segura. Você pode adquirir uma na <a href='https://bitcoinvn.io/shop' target='_blank' rel='noopener'>loja BitcoinVN</a>, fornecedora oficial de dispositivos das principais marcas, como Trezor e Ledger."
    - question: "Estou com problemas na verificação por SMS. O que fazer?"
      answer: "Por causa de mudanças recentes nas operadoras locais, a entrega de SMS para códigos OTP pode ser afetada. Entre em contato com a nossa equipe de suporte pelo <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram</a> ou pelo <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>Facebook</a> e ajudamos você a concluir a transação."
    - question: "Posso comprar Bitcoin online?"
      answer: "Pode sim! Se preferir comprar Bitcoin online, acesse <a href='https://bitcoinvn.io' target='_blank' rel='noopener'>bitcoinvn.io</a> e use o nosso serviço de exchange. Estão disponíveis transferências bancárias e outras formas de pagamento."
    - question: "Quais outras criptomoedas os BTMs aceitam?"
      answer: "O BTC é o nosso ativo principal, mas desde maio de 2026 as nossas máquinas também aceitam USDT (Tether) e USDC (Circle) na rede Ethereum, além de ZEC (Zcash) e XMR (Monero). Outras integrações de blockchain podem ser adicionadas ao longo do tempo, conforme a demanda e a evolução contínua da <a href='https://bitcoinvn.io/api/doc' target='_blank' rel='noopener'>API do mecanismo de swap da BitcoinVN</a>."

locations:
  regions:
    - name: "Ho Chi Minh City"
      description: "A maior cidade do Vietnã e seu polo econômico — lar de uma comunidade expatriada vibrante e de uma adoção crescente do Bitcoin."
      machines:
        big-pig-bbq:
          hours_display: "Todos os dias 10h30 – 23h30"
          description:
            - "Bitcoin & carne — que combinação! O Big Pig BBQ leva a Saigon um autêntico churrasco no estilo americano: brisket, costelas, pulled pork e muito mais. Localizado bem ao lado do aeroporto, na Truong Son Street, é um dos pontos mais convenientes para comprar ou vender Bitcoin em toda Ho Chi Minh City."
            - "Esteja você chegando ou saindo de Saigon, passe no Big Pig para um churrasco de primeira e use o nosso caixa eletrônico de Bitcoin. O BTM fica dentro do restaurante e está disponível em todo o horário de funcionamento."
          photos:
            - caption: "Big Pig em 2023: ainda com sua fachada vermelha — e abrigando, na época, um dos modelos mais antigos da nossa linha."
            - caption: "No Big Pig dá para encher o prato de carne."
            - caption: "Linha Gustav BTM por dentro — fruto da engenharia sueco-vietnamita"
        capones-chicago-pizza:
          hours_display: "Todos os dias 11h – 23h"
          description:
            - "O Capone's é o único lugar do Vietnã que serve a autêntica pizza deep dish no estilo Chicago. Bem no coração de Thao Dien, distrito 2, o restaurante oferece, do seu terraço, uma vista incrível do Landmark 81 — o prédio mais alto do Vietnã."
            - "Além da pizza deep dish, o Capone's serve uma variedade de clássicos do street food americano. O BTM da BitcoinVN fica dentro do restaurante, o que facilita comprar ou vender Bitcoin enquanto você curte uma refeição num dos bairros mais badalados de Saigon."
          photos:
            - caption: "Capone's — um pedaço de Chicago em Thao Dien"
            - caption: "Gustav BTM — ao lado da escada, no interior do Capone's"
            - caption: "Especialidade deep dish no Capone's"
        green-box:
          hours_display: "Todos os dias 8h – 0h"
          description:
            - "O Green Box em Thao Dien é um ponto popular de comida saudável, servindo poke bowls criativos, pratos de fusão vietnamita e sucos naturais num ambiente comunitário e descontraído, dentro do SOMA, na Le Van Mien Street. Como parceiro de longa data do BTM da BitcoinVN, é um lugar prático para comprar ou vender Bitcoin em dinheiro no distrito 2."
            - "Localizado em um dos bairros mais vibrantes de expatriados e nômades digitais de Ho Chi Minh City, o local conta com um entorno andável, atendimento simpático e funcionamento diário das 8h à meia-noite — o acesso ao BTM da BitcoinVN é simples, seja para uma refeição rápida ou uma sessão de trabalho remoto."
          photos:
            - caption: "Green Box em Thao Dien — siga a placa laranja"
            - caption: "Comida fresca e clima descontraído no Green Box"
            - caption: "Por dentro do Green Box, no SOMA"
        italianis-ben-thanh:
          hours_display: "Todos os dias 11h – 23h30"
          description:
            - "O Italiani's Pizza, na Nguyen Thai Binh Street, fica no agitado coração do distrito 1, a poucos passos do Ben Thanh Market — um dos pontos mais icônicos de Ho Chi Minh City."
            - "Seja para uma Margherita clássica ou algo mais ousado, o Italiani's entrega comida italiana de qualidade num ambiente vibrante."
            - "O distrito 1 é o coração comercial e turístico de Ho Chi Minh City, o que torna este local um dos endereços BTM mais acessíveis tanto para visitantes quanto para moradores. A região é bem servida de transporte público e fica a uma curta caminhada de inúmeros hotéis, lojas e atrações."
            - "Passe no Italiani's para um pedaço da Itália no Vietnã — e aproveite para empilhar uns sats no BTM."
          photos:
            - caption: "A famosa pizza Burrata — destaque frequente do cardápio do Italiani's"
            - caption: "O Italiani's Ben Thanh recebe a nossa variante mais colorida 'Fiat Eater' da linha Gustav BTM"
        italianis-han-thuyen:
          hours_display: "Todos os dias 11h – 21h45"
          description:
            - "O Italiani's na Han Thuyen Street fica bem ao lado de um belo parque, no bairro de Ben Nghe, distrito 1. Um lugar tranquilo para curtir uma pizza e fazer uma transação em Bitcoin, longe do agito das ruas principais."
            - "A unidade da Han Thuyen une o charme de um restaurante italiano de bairro à praticidade do acesso ao Bitcoin. Seja você um veterano do Bitcoin ou alguém fazendo a primeira compra, a equipe simpática vai te guiar em todo o processo."
          photos:
            - caption: "Pizza & Bitcoin: a combinação dos sonhos consagrada por Laszlo Hanyecz"
            - caption: "Siga o ₿ laranja: a entrada do Italiani's Han Thuyen"
            - caption: "Nosso Gustav BTM fica no andar de cima — sua privacidade, respeitada."
    - name: "Vung Tau"
      description: "Um destino litorâneo popular a apenas duas horas de Saigon — surf, sol e Bitcoin à beira-mar."
      machines:
        surf-hostel:
          hours_display: "Todos os dias 8h – 22h"
          description:
            - "O Surf Hostel em Vung Tau é uma escola de surfe e um hostel para mochileiros, a poucos minutos da praia. Oferece aulas de surfe, aluguel de pranchas e um clima comunitário relaxado, muito procurado por viajantes, mochileiros e nômades digitais. Como parceiro do BTM da BitcoinVN, é um lugar prático para comprar ou vender Bitcoin curtindo o ambiente litorâneo."
            - "Situado em um dos destinos preferidos de fim de semana no sul do Vietnã, partindo de Ho Chi Minh City, o hostel combina o clima descontraído da praia com fácil acesso aos serviços de Bitcoin durante o horário de funcionamento, das 8h às 22h. Seja para recarregar a carteira entre as sessões de surfe ou trocar para gastar localmente, é possível usar o BTM da BitcoinVN de forma rápida e prática."
          photos:
            - caption: "BTM BitcoinVN no Surf Hostel"
            - caption: "Clima de escola de surfe no Surf Hostel"
    - name: "Da Nang"
      description: "O polo costeiro do Vietnã central — vida de praia, hospitalidade internacional e acesso ao Bitcoin em uma das cidades que mais crescem no país."
      machines:
        westwood-da-nang:
          hours_display: "Todos os dias 12h – 23h"
          description:
            - "O Westwood Da Nang é um destino gastronômico moderno em An Thuong, entre My Khe Beach e o Han River, oferecendo uma experiência de jantar mais elevada em um dos distritos de hospitalidade mais ativos de Da Nang."
            - "O cardápio gira em torno de cozinha em forno a lenha, carnes premium, frutos do mar, ingredientes sazonais e pratos de inspiração ocidental cuidadosamente preparados, além de uma forte seleção de vinhos e coquetéis. Com seu ambiente refinado e acolhedor, o Westwood é um lugar prático para comprar ou vender Bitcoin durante uma visita ao centro de Da Nang."
          photos:
            - caption: "BTM BitcoinVN dentro do Westwood Da Nang"
            - caption: "Westwood Da Nang em An Thuong"
            - caption: "O BTM fica dentro do restaurante, perto da arte interior do Westwood."
            - caption: "Detalhes do salão e acesso a Bitcoin no Westwood Da Nang"

host_page:
  meta_description: "Seja parceiro da BitcoinVN e hospede um caixa eletrônico de Bitcoin no seu estabelecimento. Renda mensal fixa de aluguel, custo zero de equipamento, operação totalmente gerenciada."
  hero:
    heading: "Hospede um caixa eletrônico de Bitcoin com a BitcoinVN"
    intro: "A BitcoinVN continua aberta a expandir, de forma seletiva, sua rede de caixas eletrônicos de Bitcoin (BTM) pelo Vietnã, em linha com as exigências locais. Fazemos parcerias com locais de alto fluxo: varejo, hostels/hotéis, cafés, pizzarias e restaurantes ocidentais, para instalar e operar BTMs seguros e totalmente gerenciados."
    value_prop:
      you_provide: "Você fornece o espaço."
      we_provide: "Nós fornecemos a infraestrutura."
      you_receive: "Você recebe renda passiva."
  benefits:
    section_tag: "Seus benefícios"
    heading: "Por que hospedar um caixa BitcoinVN?"
    items:
      - title: "Renda mensal fixa de aluguel"
        description: "Receba um pagamento de aluguel previsível e fixo todo mês — independentemente do volume de transações. Os pagamentos são liquidados no dia 28 de cada mês."
      - title: "Mais tráfego internacional"
        description: "Os usuários de caixas eletrônicos de Bitcoin costumam ser turistas, expatriados, nômades digitais e trabalhadores remotos. Esses clientes frequentemente fazem compras adicionais durante a visita, aumentando a visibilidade do estabelecimento e o movimento."
      - title: "Custo zero de equipamento"
        description: "A BitcoinVN cobre todos os custos relacionados a entrega e instalação, inspeção, manutenção e suporte, reparos e substituição, monitoramento e gestão do sistema, e remoção, se necessário."
      - title: "Operação totalmente gerenciada"
        description: "Cuidamos da logística do dinheiro, da operação do software, dos procedimentos de compliance, dos requisitos de KYC, do monitoramento da máquina e do atendimento ao cliente. Você foca no seu negócio principal. Nós cuidamos do resto."
  requirements:
    section_tag: "Como começar"
    heading: "Requisitos para hospedar"
    intro: "Hospedar um BTM da BitcoinVN é simples."
    subheading: "Você disponibiliza:"
    items:
      - "Espaço interno de 80 cm × 80 cm"
      - "Acesso de cliente desimpedido e visível"
      - "Tomada elétrica padrão (110–220 V)"
      - "Acesso físico a uma porta de roteador Ethernet para uma conexão de internet cabeada estável"
  ideal_locations:
    section_tag: "Melhor encaixe"
    heading: "Locais ideais para hospedar"
    intro: "Atualmente priorizamos:"
    items:
      - "Hotéis e hostels"
      - "Pizzarias"
      - "Restaurantes ocidentais"
      - "Cafés"
