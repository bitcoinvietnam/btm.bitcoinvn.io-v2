            - "Han Thuyen 지점은 동네 이탈리아 레스토랑의 매력과 Bitcoin 접근의 편리함을 겸비하고 있습니다. 오랜 Bitcoin 사용자든 처음 구매하시는 분이든, 친절한 직원이 과정을 안내해 드립니다."
          photos:
