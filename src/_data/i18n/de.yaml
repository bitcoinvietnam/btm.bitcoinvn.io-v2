    - title: "Sofortiger Tausch vor Ort"
      description: "Schließen Sie Ihre Transaktion direkt am Standort ab — ohne unbekannte Gegenparteien oder Vorab-Überweisungen."
    - title: "Zuverlässig und überwacht"
      description: "Alle BTMs werden durchgehend überwacht, mit Echtzeit-Statusmeldungen. Verfügbarkeit wird über unsere Telegram- und Facebook-Kanäle gemeldet."
