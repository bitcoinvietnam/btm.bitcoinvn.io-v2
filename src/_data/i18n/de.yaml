    message:
      - "Nach mehr als einem Jahrzehnt des Betriebs von Bitcoin-Automaten (BTMs) in Vietnam wird sich das Team von BitcoinVN in den kommenden Wochen schrittweise aus dem direkten BTM-Betrieb auf dem vietnamesischen Markt zurückziehen."
      - "Wir arbeiten eng mit den relevanten Partnern und Beteiligten zusammen, um einen geordneten Übergang sicherzustellen."
      - "Weitere Updates folgen, sobald die Details feststehen."

