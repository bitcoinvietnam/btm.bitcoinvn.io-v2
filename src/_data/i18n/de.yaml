faq:
  items:
    - question: "Was ist ein Bitcoin-Automat?"
      answer: "Ein Bitcoin-Automat (oder BTM) ist ein Selbstbedienungs-Kiosk für Kryptowährungen, an dem Sie Bitcoin gegen Bargeld kaufen und verkaufen können. Er funktioniert ähnlich wie ein gewöhnlicher Geldautomat — anstatt jedoch Bargeld von Ihrem Bankkonto auszuzahlen, ermöglicht er Ihnen, Bargeld gegen Bitcoin zu tauschen und umgekehrt."
    - question: "Warum sollte ich einen BitcoinVN BTM nutzen?"
      answer: "BitcoinVN BTMs bieten den schnellsten und privatesten Weg, Bitcoin in Vietnam zu kaufen und zu verkaufen. Es ist kein Bankkonto nötig, und Transaktionen sind in wenigen Minuten abgeschlossen. Wir sind seit 2014 aktiv und damit der etablierteste Bitcoin-Dienst Vietnams."
    - question: "Muss ich einen Ausweis vorlegen oder mich identifizieren (KYC)?"
      answer: "BitcoinVN BTMs sind auf unkomplizierte Bitcoin-Transaktionen vor Ort ausgelegt. Für den typischen Alltagsgebrauch lassen sich Transaktionen schnell am Automaten abschließen — ohne langwierigen Onboarding-Prozess und nach einem datensparsamen Ansatz, der die unnötige Preisgabe persönlicher Daten begrenzt."
    - question: "Gibt es Transaktionslimits?"
      answer: "Aktuell gibt es keine Transaktionslimits an unseren BTMs. Sie können in einer einzigen Transaktion so viel Bitcoin kaufen oder verkaufen, wie Sie benötigen."
    - question: "Wie hoch sind die Gebühren?"
      answer: "Unsere Gebührenstruktur ist wettbewerbsfähig und transparent. Der auf dem BTM-Bildschirm angezeigte Preis enthält alle Gebühren — was Sie sehen, bekommen Sie. Keine versteckten Kosten, keine überraschenden Abzüge."
    - question: "Ist Bitcoin in Vietnam legal?"
      answer: "Bitcoin ist in Vietnam zwar kein gesetzliches Zahlungsmittel, der Besitz von Bitcoin ist jedoch nicht verboten. Vietnam entwickelt sich allerdings hin zu einem stärker regulierten Markt für Krypto-Assets, wobei detaillierte Regeln und Anforderungen schrittweise eingeführt werden. Die Verfügbarkeit des Services kann sich daher mit der Entwicklung des neuen Rechtsrahmens ändern. Weitere Informationen finden Sie im Dekret Nr. 284/2026/NĐ-CP."
    - question: "Wie kann ich prüfen, ob ein BTM gerade online ist?"
      answer: "Wir veröffentlichen Echtzeit-Statusmeldungen unserer BTMs auf unserem <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram-Kanal</a> und unserer <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>Facebook-Seite</a>. Folgen Sie uns für aktuelle Verfügbarkeitsinformationen."
    - question: "Was, wenn ich noch keine Bitcoin-Wallet habe?"
      answer: "Kein Problem! Unsere BTMs können während des Kaufs eine Paper Wallet für Sie erstellen. Sie erhalten einen Ausdruck mit Ihrer Bitcoin-Adresse und dem privaten Schlüssel. Wir empfehlen, Ihre Mittel anschließend in eine sichere Wallet zu überführen — für langfristige Aufbewahrung ist eine Hardware Wallet die sicherste Option. Diese erhalten Sie im <a href='https://bitcoinvn.io/shop' target='_blank' rel='noopener'>BitcoinVN Shop</a>, einem offiziellen Lieferanten von Geräten führender Marken wie Trezor und Ledger."
    - question: "Ich habe Probleme mit der SMS-Verifizierung. Was soll ich tun?"
      answer: "Aufgrund aktueller inländischer Telekommunikationsänderungen kann die SMS-Zustellung für OTP-Codes beeinträchtigt sein. Bitte wenden Sie sich an unseren Support über <a href='https://t.me/BitcoinATMHCMC' target='_blank' rel='noopener'>Telegram</a> oder <a href='https://www.facebook.com/BitcoinATMHCMC' target='_blank' rel='noopener'>Facebook</a>, und wir unterstützen Sie bei der Abwicklung Ihrer Transaktion."
    - question: "Kann ich Bitcoin stattdessen online kaufen?"
      answer: "Ja! Wenn Sie Bitcoin lieber online kaufen möchten, besuchen Sie <a href='https://bitcoinvn.io' target='_blank' rel='noopener'>bitcoinvn.io</a> und nutzen Sie unseren Online-Börsendienst. Banküberweisungen und weitere Zahlungsmethoden stehen zur Verfügung."
    - question: "Welche anderen Kryptowährungen unterstützen Ihre BTMs?"
      answer: "BTC ist unser Hauptasset, doch seit Mai 2026 unterstützen unsere Automaten auch USDT (Tether) und USDC (Circle) auf dem Ethereum-Netzwerk sowie ZEC (Zcash) und XMR (Monero). Weitere Blockchain-Integrationen können mit der Zeit hinzukommen, je nach Nachfrage und Weiterentwicklung der <a href='https://bitcoinvn.io/api/doc' target='_blank' rel='noopener'>BitcoinVN Swap-Engine-API</a>."

locations:
  regions:
    - name: "Ho Chi Minh City"
      description: "Vietnams größte Stadt und Wirtschaftszentrum — Heimat einer lebendigen Expat-Community und einer wachsenden Bitcoin-Akzeptanz."
      machines:
        big-pig-bbq:
          hours_display: "Täglich 10:30 – 23:30 Uhr"
          description:
            - "Bitcoin & Fleisch — was für eine Kombination! Big Pig BBQ bringt authentisches amerikanisches BBQ nach Saigon, mit Brisket, Ribs, Pulled Pork und mehr. Direkt neben dem Flughafen an der Truong Son Street gelegen, ist es einer der bequemsten Orte, um Bitcoin in ganz Ho Chi Minh City zu kaufen oder zu verkaufen."
            - "Ob Sie in Saigon ankommen oder abreisen — schauen Sie bei Big Pig vorbei für erstklassiges BBQ und nutzen Sie unseren Bitcoin-Automaten. Der BTM befindet sich im Restaurant und steht während der gesamten Öffnungszeiten zur Verfügung."
          photos:
            - caption: "Big Pig 2023: noch im roten Außendesign — damals mit einem unserer älteren Modelle bestückt."
            - caption: "Bei Big Pig kommen Sie auf Ihre Fleisch-Kosten."
            - caption: "Gustav-BTM-Serie im Inneren — angetrieben von schwedisch-vietnamesischer Ingenieurskunst."
        capones-chicago-pizza:
          hours_display: "Täglich 11 – 23 Uhr"
          description:
            - "Capone's ist der einzige Ort in Vietnam, der authentische Chicago-Style Deep-Dish-Pizza serviert. Im Herzen von Thao Dien, Distrikt 2, bietet das Restaurant von seiner Dachterrasse aus einen atemberaubenden Blick auf das Landmark 81 — das höchste Gebäude Vietnams."
            - "Neben Deep-Dish-Pizza serviert Capone's eine Auswahl amerikanischer Streetfood-Klassiker. Der BitcoinVN BTM steht praktischerweise im Restaurant und macht es einfach, Bitcoin zu kaufen oder zu verkaufen, während Sie in einem der angesagtesten Viertel Saigons speisen."
          photos:
            - caption: "Capone's — ein Stück Chicago in Thao Dien"
            - caption: "Gustav-BTM — gleich neben der Treppe im Innenraum von Capone's"
            - caption: "Deep-Dish-Spezialität bei Capone's"
        green-box:
          hours_display: "Täglich 8 – 24 Uhr"
          description:
            - "Green Box in Thao Dien ist ein beliebter Spot für gesunde Küche und serviert kreative Poke Bowls, vietnamesische Fusionsgerichte und frische Smoothies in entspannter Atmosphäre im SOMA an der Le Van Mien Street. Als langjähriger BitcoinVN-BTM-Partner bietet das Lokal einen bequemen Ort, um Bitcoin in Distrikt 2 gegen Bargeld zu tauschen."
            - "Gelegen in einem der lebhaftesten Expat- und Digital-Nomad-Viertel Ho Chi Minh Citys, bietet das Lokal eine fußgängerfreundliche Umgebung, freundliches Personal und Öffnungszeiten täglich von 8 bis 24 Uhr — der Zugang zum BitcoinVN BTM ist unkompliziert, ob für ein schnelles Essen oder eine Remote-Work-Session."
          photos:
            - caption: "Green Box in Thao Dien — folgen Sie dem orangefarbenen Schild"
            - caption: "Frische Küche und entspannte Atmosphäre im Green Box"
            - caption: "Im Inneren des Green Box im SOMA"
        italianis-ben-thanh:
          hours_display: "Täglich 11 – 23:30 Uhr"
          description:
            - "Italiani's Pizza an der Nguyen Thai Binh Street liegt im pulsierenden Herzen von Distrikt 1, nur wenige Schritte vom Ben Thanh Market entfernt — einem der ikonischsten Wahrzeichen von Ho Chi Minh City."
            - "Ob Sie Lust auf eine klassische Margherita haben oder etwas Gewagteres — Italiani's liefert hochwertige italienische Küche in lebendigem Ambiente."
            - "Distrikt 1 ist das kommerzielle und touristische Zentrum von Ho Chi Minh City, was diesen Standort zu einem der zugänglichsten BTM-Standorte für Besucher wie Einheimische macht. Das Gebiet ist gut an den öffentlichen Nahverkehr angebunden und liegt fußläufig zu zahlreichen Hotels, Geschäften und Sehenswürdigkeiten."
            - "Kommen Sie bei Italiani's für ein Stück Italien in Vietnam vorbei — und stacken Sie dabei am BTM ein paar Sats."
          photos:
            - caption: "Die berühmte Burrata-Pizza — ein fester Höhepunkt auf der Karte von Italiani's"
            - caption: "Italiani's Ben Thanh beherbergt unsere farbenfrohere „Fiat Eater“-Variante der Gustav-BTM-Serie"
        italianis-han-thuyen:
          hours_display: "Täglich 11 – 21:45 Uhr"
          description:
            - "Der Italiani's-Standort an der Han Thuyen Street liegt direkt neben einem schönen Park im Ben-Nghe-Viertel von Distrikt 1. Ein ruhiger Ort, um eine Pizza zu genießen und eine Bitcoin-Transaktion abzuwickeln — abseits vom Trubel der Hauptstraßen."
            - "Der Standort Han Thuyen vereint den Charme eines familiengeführten italienischen Restaurants mit der Bequemlichkeit eines Bitcoin-Zugangs. Ob Sie Bitcoin-Veteran sind oder Ihren ersten Kauf tätigen — das freundliche Personal hilft Ihnen gerne weiter."
          photos:
            - caption: "Pizza & Bitcoin: die berühmte Kombination, etabliert von Laszlo Hanyecz"
            - caption: "Folgen Sie dem orangenen ₿: der Eingang von Italiani's Han Thuyen"
            - caption: "Unser Gustav-BTM steht im oberen Stockwerk — Ihre Privatsphäre, respektiert."
    - name: "Vung Tau"
      description: "Ein beliebter Küstenort, nur zwei Stunden von Saigon entfernt — Surfen, Sonne und Bitcoin am Strand."
      machines:
        surf-hostel:
          hours_display: "Täglich 8 – 22 Uhr"
          description:
            - "Das Surf Hostel in Vung Tau ist eine Surfschule und Backpacker-Herberge nur wenige Minuten vom Strand entfernt. Es bietet Surfunterricht, Board-Verleih und eine entspannte Gemeinschaftsatmosphäre — beliebt bei Reisenden, Backpackern und Digital Nomads. Als BitcoinVN-BTM-Partner bietet es einen bequemen Ort, Bitcoin im Küstenambiente zu kaufen oder zu verkaufen."
            - "Gelegen in einem der beliebtesten Wochenend-Ausflugsziele Südvietnams ab Ho Chi Minh City, verbindet das Hostel entspanntes Strandflair mit einfachem Zugang zu Bitcoin-Diensten während der Öffnungszeiten von 8 bis 22 Uhr. Ob Wallet zwischen den Surfsessions aufladen oder für lokale Ausgaben auszahlen — Besucher können den BitcoinVN BTM schnell und bequem nutzen."
          photos:
            - caption: "BitcoinVN BTM im Surf Hostel"
            - caption: "Surfschul-Atmosphäre im Surf Hostel"
    - name: "Da Nang"
      description: "Vietnams zentraler Küstenknotenpunkt — Strandleben, internationale Gastfreundschaft und Bitcoin-Zugang in einer der am schnellsten wachsenden Städte des Landes."
      machines:
        westwood-da-nang:
          hours_display: "Täglich 12 – 23 Uhr"
          description:
            - "Westwood Da Nang ist ein modernes Restaurantziel in An Thuong, zwischen My Khe Beach und dem Han River, und bietet ein gehobenes Abendessen in einem der aktivsten Hospitality-Viertel von Da Nang."
            - "Die Karte konzentriert sich auf Holzfeuerküche, hochwertiges Fleisch, Meeresfrüchte, saisonale Zutaten und sorgfältig zubereitete westlich inspirierte Gerichte, ergänzt durch eine starke Auswahl an Weinen und Cocktails. Mit seiner raffinierten, aber zugänglichen Atmosphäre ist Westwood ein bequemer Ort, um bei einem Besuch im Zentrum von Da Nang Bitcoin zu kaufen oder zu verkaufen."
          photos:
            - caption: "BitcoinVN BTM im Westwood Da Nang"
            - caption: "Westwood Da Nang in An Thuong"
            - caption: "Der BTM steht im Restaurant nahe der Innenraumkunst von Westwood."
            - caption: "Details des Gastraums und Bitcoin-Zugang im Westwood Da Nang"

